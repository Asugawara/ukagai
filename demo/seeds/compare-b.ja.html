<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;min-height:480px;display:flex;font-family:Georgia,"Hiragino Mincho ProN",serif;color:#3a1a08}
.l{flex:0 0 45%;background:#ea580c;color:#fff;padding:22px 16px;display:flex;flex-direction:column;justify-content:center}.l q{font-style:italic;font-size:19px;line-height:1.35;quotes:none;margin:0 0 14px}.l span{font-size:12px;opacity:.9}
.r{flex:1;background:#fff5ec;padding:26px 16px;display:flex;flex-direction:column;justify-content:center}h1{font-size:28px;margin:0 0 8px}.r p{font-size:13px;color:#7a3d14;margin:0 0 14px}
label{font-size:11px;font-weight:700;letter-spacing:.06em;margin:0 0 4px;display:block}input{display:block;width:100%;height:38px;margin:0 0 12px;padding:0 8px;border:2px solid #3a1a08;background:#fff;font-size:14px}
button{width:100%;min-height:48px;border:0;background:#3a1a08;color:#fff;font-weight:700;font-size:15px;font-family:inherit}</style></head><body>
<div class="l"><q>「チーム全体が午後 1 回で移行できました。」</q><span>朴 美奈、エンジニアリング責任者</span></div><div class="r"><h1>はじめる</h1><p>数分でワークスペースを設定できます。</p><label>メール</label><input placeholder="you@company.com"><label>ワークスペース</label><input placeholder="株式会社サンプル"><button>ワークスペースを作成</button></div></body></html>
