<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ukagai</title>
<link rel="stylesheet" href="/public/app.css">
</head>
<body>
<button id="pending-btn" class="pending-btn" type="button" aria-controls="drawer" aria-expanded="false" hidden>保留 <span id="pending-count">0</span> <kbd class="kbd">←</kbd><kbd class="kbd">→</kbd></button>
<div id="banner" class="banner" hidden></div>
<main id="main" hidden>
  <section id="background" aria-label="背景"></section>
  <section id="decision" aria-label="判断"></section>
</main>
<div id="empty" class="empty">
  <div class="empty-title">判断待ちはありません</div>
  <div class="empty-sub">エージェントが質問すると、ここに表示されます</div>
</div>
<div id="backdrop" class="backdrop" hidden></div>
<aside id="drawer" class="drawer" aria-label="保留一覧" aria-hidden="true">
  <h2>保留一覧</h2>
  <div class="keys"><kbd class="kbd">↑</kbd><kbd class="kbd">↓</kbd><span>移動</span> · <kbd class="kbd">Enter</kbd><span>表示</span> · <kbd class="kbd">Esc</kbd><kbd class="kbd">←</kbd><span>閉じる</span></div>
  <ul id="pending-list"></ul>
</aside>
<script src="/public/vendor/marked.umd.js"></script>
<script src="/public/vendor/mermaid.min.js"></script>
<script type="module" src="/public/app.js"></script>
</body>
</html>
