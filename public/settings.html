<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<!-- The server injects lang / data-lang (and data-theme when pinned) into <html>; the sidebar and the form are built by settings.js -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ukagai · Settings</title>
<link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/public/favicon.png" type="image/png" sizes="32x32">
<link rel="stylesheet" href="/public/app.css">
</head>
<body class="settings-page">
<div class="set" role="main">
  <a id="back" class="set-back" href="/"></a>
  <div class="set-head">
    <h1 id="set-title"></h1>
    <p id="set-lede"></p>
  </div>
  <div class="set-layout">
    <nav id="set-nav" class="set-nav"></nav>
    <div class="set-main">
      <div id="pane-head">
        <div class="set-titlerow">
          <h2 id="pane-title"></h2>
          <span id="skill-badge" class="set-badge" hidden></span>
        </div>
        <div id="pane-lede" class="set-pane-ledes"></div>
      </div>
      <div id="form"></div>
      <section id="pane-skill" hidden></section>
    </div>
  </div>
</div>
<div id="status" class="set-status" role="status" aria-live="polite"></div>
<script src="/public/vendor/marked.umd.js"></script>
<script type="module" src="/public/settings.js"></script>
</body>
</html>
