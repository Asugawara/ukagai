name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release_please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.release_please.outputs.version }}
      ref: ${{ needs.release_please.outputs.tag_name }}

  publish:
    needs: [release_please, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release_please.outputs.tag_name }}
      V: ${{ needs.release_please.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.release_please.outputs.version }}
          path: out
      - name: Upload assets and publish the release
        run: |
          set -eux
          gh release upload "$TAG" "out/ukagai-$V.tar.gz" out/SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false --latest

  plugin_branch:
    needs: [release_please, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      V: ${{ needs.release_please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # The artifact holds only the tarball, not out/stage, so rebuild the stage.
      - name: Rebuild the stage
        run: |
          set -eux
          sh scripts/build-release.sh "$V" out
      # The whole content of branch plugin is the stage tree (node_modules included), committed from a separate
      # worktree so the repo's .gitignore never applies.
      - name: Update the plugin branch
        run: |
          set -eux
          stage="$PWD/out/stage/ukagai-$V"
          test -f "$stage/plugin.json"
          wt="$RUNNER_TEMP/plugin-wt"
          if git ls-remote --exit-code --heads origin plugin >/dev/null 2>&1; then
            git fetch origin plugin
            git worktree add -B plugin "$wt" origin/plugin
          else
            git worktree add --detach "$wt"
            git -C "$wt" checkout --orphan plugin
          fi
          # empty the tree, keep .git
          find "$wt" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$stage"/. "$wt"/
          # a stage has no .gitignore, and the checkout's must not leak in
          rm -f "$wt/.gitignore"
          git -C "$wt" add -A -f
          if git -C "$wt" diff --cached --quiet && git -C "$wt" rev-parse --verify -q HEAD >/dev/null 2>&1 && [ "$(git -C "$wt" rev-parse --abbrev-ref HEAD)" = plugin ]; then
            echo "plugin branch is already up to date"
            exit 0
          fi
          git -C "$wt" -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "release: v$V"
          git -C "$wt" push origin plugin
