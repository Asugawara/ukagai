name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release_please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.release_please.outputs.version }}
      ref: ${{ needs.release_please.outputs.tag_name }}

  publish:
    needs: [release_please, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release_please.outputs.tag_name }}
      V: ${{ needs.release_please.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.release_please.outputs.version }}
          path: out
      - name: Upload assets and publish the release
        run: |
          set -eux
          gh release upload "$TAG" "out/ukagai-$V.tar.gz" out/SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false --latest

  plugin_branch:
    needs: [release_please, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      V: ${{ needs.release_please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # The artifact holds only the tarball, not out/stage, so rebuild the stage.
      - name: Rebuild the stage
        run: |
          set -eux
          sh scripts/build-release.sh "$V" out
      # TODO(plugin): push out/stage/ukagai-$V as the tree of branch plugin
      - name: Update the plugin branch
        run: |
          set -eux
          echo "plugin branch step is added by the plugin work"
