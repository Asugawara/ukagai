name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # GUI tests skip themselves when agent-browser is not installed.
      - run: npm test

  # Renders every explanation fixture in a real browser: the GUI must keep what the hook accepts (test/gui/preserve.test.ts).
  # UKAGAI_REQUIRE_BROWSER=1 makes a missing agent-browser fail the run instead of skipping it.
  gui-preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install -g agent-browser@0.34.0
      - run: agent-browser install --with-deps
      # ubuntu-24.04 restricts unprivileged user namespaces, which Chrome's sandbox needs
      - run: UKAGAI_TERMINAL=none UKAGAI_REQUIRE_BROWSER=1 node --import tsx --test test/gui/preserve.test.ts
        env:
          AGENT_BROWSER_ARGS: --no-sandbox

  lint-sh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          set -eux
          shellcheck -s sh install.sh bin/ukagai scripts/*.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          set -eux
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --no-banner --redact

  package:
    needs: test
    uses: ./.github/workflows/package.yml
    with:
      version: 0.0.0-ci
      ref: ${{ github.sha }}
